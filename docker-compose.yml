services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenhouse-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80"
      - "5173:5173"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: greenhouse-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: greenhouse_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
